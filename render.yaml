services:
  - type: web
    name: x402-business-agent
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: eip155:8453
      - key: PAY_TO
        value: 0x031a713863890eb611776aadd48397873ed153ab
      - key: DOCUMENT_PRICE
        value: $0.01
      - key: PRICE
        value: $0.005
      - key: SITE_PRICE
        value: $0.01
      - key: VENDOR_PRICE
        value: $0.025
      - key: PILOT_PRICE
        value: $495
      - key: FACILITATOR_URL
        value: https://facilitator.openx402.ai
      - key: PUBLIC_URL
        value: https://repoedu.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://repoedu.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: Repoedu-intelligence-db
          property: connectionString
