services:
  - type: web
    name: x402-business-agent
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: eip155:8453
      - key: PAY_TO
        value: 0x031a713863890eb611776aadd48397873ed153ab
      - key: DATABASE_URL
        fromDatabase:
          name: Repoedu-intelligence-db
          property: connectionString
