name: EvidenceCheck production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API deployment
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS --max-time 10 https://repoedu.onrender.com/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for Render API deployment ($i/30)..."
            sleep 10
          done
          echo "EvidenceCheck API did not become reachable"
          exit 1

      - name: Verify API discovery metadata
        run: |
          set -e
          for path in /health /.well-known/x402 /openapi.json /skill.md /llms.txt /agent-discovery.json /.well-known/agent-card.json /.well-known/agent.json /.well-known/x402-discovery.json; do
            code=$(curl -sS --max-time 20 -o /tmp/body -w "%{http_code}" "https://repoedu.onrender.com$path")
            echo "$path HTTP $code"
            test "$code" = "200"
          done

      - name: Verify unpaid x402 responses and payment contract
        run: |
          set -e
          check_402() {
            path="$1"
            body="$2"
            name="$3"
            headers="/tmp/headers-$name"
            code=$(curl -sS --max-time 30 -D "$headers" -o "/tmp/body-$name" -w "%{http_code}" -X POST "https://repoedu.onrender.com$path" -H "Content-Type: application/json" -d "$body")
            echo "$path HTTP $code"
            test "$code" = "402"
            value=$(grep -i '^payment-required:' "$headers" | sed 's/^[^:]*:[[:space:]]*//I' | tr -d '\r\n')
            test -n "$value"
            echo "$value" | base64 -d >/tmp/decoded-$name.json
          }
          check_402 /web-extract '{"url":"https://example.com"}' web
          check_402 /site-audit '{"url":"https://example.com"}' audit
          check_402 /analyze '{"text":"Supplier must notify incidents within 24 hours."}' analyze
          check_402 /vendor-preflight '{"url":"https://example.com","requirements":["HTTPS","HSTS"]}' vendor
          node <<'NODE'
          const fs=require('fs');
          const expected='0x031a713863890eb611776aadd48397873ed153ab';
          const expectedNetwork='eip155:8453';
          const expectedPrices={web:'5000',audit:'10000',analyze:'10000',vendor:'25000'};
          for(const name of Object.keys(expectedPrices)){
            const x=JSON.parse(fs.readFileSync('/tmp/decoded-'+name+'.json','utf8'));
            const a=x.accepts?.[0];
            if(x.x402Version!==2) throw new Error(name+': not x402 v2');
            if(!a || a.network!==expectedNetwork || a.scheme!=='exact' || a.payTo!==expected) throw new Error(name+': payment requirements mismatch');
            if(String(a.amount)!==expectedPrices[name]) throw new Error(name+': price mismatch: '+a.amount);
          }
          NODE

      - name: Verify buyer routes on the canonical origin
        run: |
          set -e
          origin=https://repoedu.onrender.com
          for path in / /demo /assessment /purchase /commercial /sample-report /buy.html /openapi.json /skill.md /llms.txt /.well-known/agent-card.json /.well-known/x402 /.well-known/x402-discovery.json; do
            code=$(curl -sS --max-time 20 -o /tmp/site-body -w "%{http_code}" "$origin$path")
            echo "$path HTTP $code"
            test "$code" = "200"
          done
          home=$(curl -fsS --max-time 20 "$origin/")
          printf '%s' "$home" | grep -Fq "/demo"
          printf '%s' "$home" | grep -Fq "/openapi.json"
