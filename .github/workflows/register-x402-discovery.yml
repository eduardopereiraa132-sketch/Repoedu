name: Register x402 service for agent discovery
concurrency:
  group: x402-discovery-registration
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - distribution-status.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find live API origin
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          for origin in \
            "https://repoedu.onrender.com" \
            "https://evidencecheck-api.onrender.com" \
            "https://x402-business-agent.onrender.com"
          do
            echo "Checking $origin"
            if curl -fsS --max-time 15 "$origin/health" >/tmp/health.json; then
              echo "origin=$origin" >> "$GITHUB_OUTPUT"
              cat /tmp/health.json
              exit 0
            fi
          done
          echo "No live candidate origin found" >&2
          exit 1

      - name: Verify x402 challenge
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.txt -D /tmp/headers.txt -w "%{http_code}" \
            -X POST "$ORIGIN/vendor-preflight" \
            -H "content-type: application/json" \
            --data '{"url":"https://example.com"}')
          echo "HTTP $code"
          if [ "$code" != "402" ]; then
            echo "Expected HTTP 402 from paid route; got $code" >&2
            cat /tmp/headers.txt
            cat /tmp/response.txt
            exit 1
          fi
          grep -qi "payment-required" /tmp/headers.txt

      - name: Verify buyer experience and discovery metadata
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$ORIGIN/buy.html" -o /tmp/buy.html
          curl -fsS --max-time 15 "$ORIGIN/llms.txt" -o /tmp/llms.txt
          curl -fsS --max-time 15 "$ORIGIN/.well-known/x402-discovery.json" -o /tmp/discovery.json
          grep -q "EvidenceCheck" /tmp/buy.html
          grep -q "vendor-preflight" /tmp/llms.txt
          grep -Fq '"website":"https://repoedu.onrender.com/buy.html"' /tmp/discovery.json

      - name: Register origin with Agent402
        id: register
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          seller="${ORIGIN#https://}"
          seller="${seller%/}"
          existing_code=$(curl -sS --max-time 15 -o /tmp/existing.json -w "%{http_code}" "https://agent402.tools/api/index?seller=${seller}" || true)
          if [ "$existing_code" = "200" ]; then
            echo "Origin already present in Agent402 index: $ORIGIN"
            cp /tmp/existing.json /tmp/register.json
            exit 0
          fi
          code=$(curl -sS --max-time 20 -o /tmp/register.json -w "%{http_code}" \
            -X POST "https://agent402.tools/api/index/register" \
            -H "content-type: application/json" \
            --data "{\"origin\":\"$ORIGIN\"}")
          echo "Agent402 registration HTTP $code"
          case "$code" in
            200|201|202|409)
              cat /tmp/register.json
              ;;
            *)
              cat /tmp/register.json
              exit 1
              ;;
          esac

      - name: Record distribution status
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        run: |
          {
            echo "## Agent402 distribution"
            echo ""
            echo "- Origin: $ORIGIN"
            echo "- Seller index: registration verified or already present"
            echo "- Buyer routing: live 402 challenge verified"
          } >> "$GITHUB_STEP_SUMMARY"
