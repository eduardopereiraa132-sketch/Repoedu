name: Register x402 service for agent discovery
on:
  push:
    branches: [main]
    paths-ignore:
      - distribution-status.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find live API origin
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          for origin in \
            "https://repoedu.onrender.com" \
            "https://evidencecheck-api.onrender.com" \
            "https://x402-business-agent.onrender.com"
          do
            echo "Checking $origin"
            if curl -fsS --max-time 15 "$origin/health" >/tmp/health.json; then
              echo "origin=$origin" >> "$GITHUB_OUTPUT"
              cat /tmp/health.json
              exit 0
            fi
          done
          echo "No live candidate origin found" >&2
          exit 1

      - name: Verify x402 challenge
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.txt -D /tmp/headers.txt -w "%{http_code}" \
            -X POST "$ORIGIN/vendor-preflight" \
            -H "content-type: application/json" \
            --data '{"url":"https://example.com"}')
          echo "HTTP $code"
          if [ "$code" != "402" ]; then
            echo "Expected HTTP 402 from paid route; got $code" >&2
            cat /tmp/headers.txt
            cat /tmp/response.txt
            exit 1
          fi
          grep -qi "payment-required" /tmp/headers.txt

      - name: Register origin with Agent402
        id: register
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://agent402.tools/api/index/register" \
            -H "content-type: application/json" \
            --data "{\"origin\":\"$ORIGIN\"}" | tee /tmp/register.json
          echo "Registered: $ORIGIN"

      - name: Record distribution status
        env:
          ORIGIN: ${{ steps.discover.outputs.origin }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path("/tmp/register.json")
          data = json.loads(p.read_text())
          out = {
            "status": "registered",
            "origin": os.environ["ORIGIN"],
            "agent402": data
          }
          pathlib.Path("distribution-status.json").write_text(json.dumps(out, indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution-status.json
          git commit -m "Record x402 distribution registration"
          git push
