name: x402 discovery preflight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check unpaid payment responses
        run: |
          set -e
          for path in /analyze /site-audit; do
            if [ "$path" = "/analyze" ]; then body='{"text":"discovery preflight"}'; else body='{"url":"https://example.com"}'; fi
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST "https://repoedu-1.onrender.com$path" -H "Content-Type: application/json" -d "$body")
            echo "$path HTTP $code"
            test "$code" = "402"
          done

      - name: Check public metadata
        run: |
          set -e
          for path in / /health /.well-known/x402 /.well-known/ai-plugin.json /openapi.json /skill.md /llms.txt /robots.txt /sitemap.xml /icon.svg; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" "https://repoedu-1.onrender.com$path")
            echo "$path HTTP $code"
            test "$code" = "200"
          done
