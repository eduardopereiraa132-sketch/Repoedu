name: x402 smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check server.js
      - name: Start local service
        run: |
          npm start > /tmp/x402-server.log 2>&1 &
          echo $! > /tmp/x402-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/x402-server.log
          exit 1
      - name: Test local payment protection
        run: |
          set -e
          for path in /analyze /site-audit /web-extract; do
            if [ "$path" = "/analyze" ]; then body='{"text":"smoke test"}'; else body='{"url":"https://example.com"}'; fi
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST "http://127.0.0.1:10000$path" -H "Content-Type: application/json" -d "$body")
            echo "$path HTTP $code"
            test "$code" = "402"
          done
      - name: Verify advertised prices
        run: |
          set -e
          body=$(curl -sS http://127.0.0.1:10000/.well-known/x402)
          node -e 'const x=JSON.parse(process.argv[1]); const m=Object.fromEntries(x.endpoints.map(e=>[e.path,e])); if(m["/web-extract"].price!=="$0.005"||m["/site-audit"].price!=="$0.01"||m["/analyze"].price!=="$0.005") process.exit(1); if(x.endpoints.some(e=>e.payTo!=="0x031a713863890eb611776aadd48397873ed153ab")) process.exit(1)' "$body"

      - name: Test local metadata
        run: |
          set -e
          for path in / /health /.well-known/x402 /.well-known/ai-plugin.json /openapi.json /skill.md /llms.txt /robots.txt /sitemap.xml /icon.svg; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" "http://127.0.0.1:10000$path")
            echo "$path HTTP $code"
            test "$code" = "200"
          done
      - name: Stop local service
        if: always()
        run: |
          if [ -f /tmp/x402-server.pid ]; then kill "$(cat /tmp/x402-server.pid)" || true; fi
