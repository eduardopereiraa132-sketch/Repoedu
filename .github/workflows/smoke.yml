name: x402 smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check server.js
      - name: Wait for Render rollout
        run: |
          set -e
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/root -w "%{http_code}" https://repoedu-1.onrender.com/)
            echo "rollout probe $i: HTTP $code"
            if [ "$code" = "200" ]; then
              if grep -q "Agent Security & Document Intelligence" /tmp/root; then
                echo "new deployment detected"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render did not expose the new landing page within the retry window"
          exit 1
      - name: Test public service
        env:
          API_URL: https://repoedu-1.onrender.com/analyze
        run: node test-payment.js
      - name: Test public metadata
        run: |
          node - <<'NODE'
          const base = "https://repoedu-1.onrender.com";
          for (const path of ["/", "/health", "/.well-known/x402", "/.well-known/ai-plugin.json", "/openapi.json", "/skill.md", "/llms.txt", "/robots.txt", "/sitemap.xml", "/icon.svg"]) {
            const r = await fetch(base + path);
            if (!r.ok) throw new Error(path + " returned HTTP " + r.status);
            console.log(path, r.status);
          }
          for (const [path, body] of [["/analyze", {text:"smoke test"}], ["/site-audit", {url:"https://example.com"}]]) {
            const r = await fetch(base + path, {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
            if (r.status !== 402) throw new Error(path + " expected 402, got " + r.status);
            console.log(path, r.status);
          }
          NODE
